{% import 'huzdfel_macros.html' as macros %}
<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés – {{ titlename }}</title>
    {% include 'huzdfel_resources.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bejelentkezes.css') }}">
</head>

<body>
    {% include 'huzdfel_navbar.html' %}
    <main>
        <div class="card" style="width: 800px; margin: 20px auto; gap: 0; padding-bottom: 6px;">
            <h1 style="font-size: 2rem; color: var(--primary); text-align: center;">Bejelentkezés</h1>
            <form action="/">
                <div class="form-row">
                    <div class="field">
                        <label for="email">Email cím</label>
                        <input type="email" id="email" required maxlength="64" autocomplete="email username" placeholder="pelda@gmail.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="field" style="position: relative;">
                        <label for="passw">Jelszó</label>
                        <button type="button" class="eye-button" onclick="toggleVisibility('passw')"><i class="fas fa-eye"></i></button>
                        <input type="password" id="passw" required maxlength="64" autocomplete="current-password">
                    </div>
                </div>
                <input type="submit" value="Bejelentkezés">
            </form>
            <p style="font-size: .8rem; color: var(--text-lighter); margin-top: 48px;">Nincs még fiókja? <a href="/regisztracio">Regisztráljon egyet itt.</a></p>
        </div>
    </main>
    {% include 'huzdfel_footer.html' %}
    {% include 'huzdfel_scripts.html' %}
    <script src="{{ url_for('static', filename='script/login.js') }}"></script>
</body>

</html>
